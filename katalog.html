<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog - ull.crochet</title>
    <meta name="description" content="Lihat koleksi lengkap produk crochet handmade kami. Bouquet, doll, gift, dan custom order tersedia.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loading Screen -->
    <div class="loader">
        <div class="loader-content">
            <div class="loader-circle"></div>
            <span>ull.crochet</span>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html">ull.<span>crochet</span></a>
            </div>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="katalog.html" class="nav-link active">Catalog</a></li>
                <li><a href="https://instagram.com/ull.crochet" target="_blank" class="nav-link">Instagram</a></li>
                <li><a href="index.html#contact" class="nav-link">Contact</a></li>
            </ul>
            <div class="nav-toggle" id="nav-toggle">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <button class="dark-toggle" id="darkToggle">
                <i class="sun-icon">☀️</i>
                <i class="moon-icon">🌙</i>
            </button>
        </div>
    </nav>

    <!-- Catalog Header -->
    <section class="catalog-header">
        <div class="container">
            <h1>Our Handmade Collection</h1>
            <p>Temukan karya crochet yang sempurna untuk Anda</p>
        </div>
    </section>

    <!-- Catalog Controls -->
    <section class="catalog-controls reveal">
        <div class="container">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Cari produk...">
                <i>🔍</i>
            </div>
            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">Semua</button>
                <button class="filter-btn" data-filter="bouquet">Bouquet</button>
                <button class="filter-btn" data-filter="doll">Crochet Doll</button>
                <button class="filter-btn" data-filter="gift">Gift</button>
                <button class="filter-btn" data-filter="custom">Custom</button>
            </div>
        </div>
    </section>

    <!-- Catalog Grid -->
    <section class="catalog-grid reveal" id="catalogGrid">
        <div class="container">
            <!-- Products will be generated by JS -->
        </div>
    </section>

    <!-- Product Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-body">
                <div class="modal-image">
                    <img id="modalImage" src="" alt="">
                </div>
                <div class="modal-info">
                    <h2 id="modalTitle"></h2>
                    <span class="modal-price" id="modalPrice"></span>
                    <div class="modal-description" id="modalDescription"></div>
                    <a href="#" id="modalOrder" class="btn btn-primary">Order via WhatsApp</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating WhatsApp -->
    <a href="https://wa.me/6281234567890" class="whatsapp-float" target="_blank">
        <i>💬</i>
    </a>

    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop">
        <i>↑</i>
    </button>

    <script src="script.js"></script>
</body>
</html>
